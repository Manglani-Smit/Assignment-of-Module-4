{% extends 'header.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>


</head>
<body>

<h1>New Password</h1>
{%if msg%}
<b style="color: gold;">
    {{msg}}
</b>
{%endif%}
<form method="post" action="{% url 'new-password' %}"> {% csrf_token %}
    <table>
        <tr>
            <td>New Password</td>
            <td><input type="password" name="new_password"> </td>
        </tr>

        <tr>
            <td>Confirm Password</td>
            <td><input type="password" name="cnew_password"> </td>
        </tr>
        <tr>
            <td align="center">
                <input type="submit" value="Update Password" class="btn btn-primary">
            </td>
        </tr>
    </table>

</form>
</body>
</html>
{% endblock %}
