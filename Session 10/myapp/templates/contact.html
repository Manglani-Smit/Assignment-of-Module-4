{% extends 'header.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>


</head>
<body>

<h1>Welcome To Contact</h1>
{%if msg%}
<b style="color: gold;"> 
    {{msg}}
</b>
{%endif%}
<form method="post" action="{% url 'contact' %}"> {% csrf_token %}
    <table>
        <tr>
            <td>Name</td>
            <td><input type="text" name="name"></td>
        </tr>
        <tr>
            <td>Email</td>
            <td><input type="email" name="email"></td>
        </tr>
        <tr>
            <td>Mobile</td>
            <td><input type="number" name="mobile"></td>
        </tr>
        <tr>
            <td>Remarks</td>
            <td><textarea rows="5" cols="22" name="remarks"></textarea></td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="SUBMIT" class="btn btn-primary">
            </td>
        </tr>
    </table>
    
</form>
<h1>Recent Contacts</h1>
{% for i in contacts %}
    Name : {{i.name}}<br>
    Remarks : {{i.remarks}}<br><hr>
{%endfor%}
</body>
</html>
{% endblock %}
