{% extends 'header.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>


</head>
<body>

<h1>Welcome To Login</h1>
{%if msg%}
<b style="color: gold;">
    {{msg}}
</b>
{%endif%}
<form method="post" action="{% url 'login' %}"> {% csrf_token %}
    <table>
        <tr>
            <td>Email</td>
            <td><input type="email" name="email"></td>
        </tr>
        <tr>
            <td>Password</td>
            <td><input type="password" name="password"> </td>
        </tr>
        <tr>
            <td align="center">
                <input type="submit" value="LOGIN" class="btn btn-primary">
            </td>

        </tr>
    </table>

</form>
</body>
</html>
{% endblock %}
