<!DOCTYPE html>
<html>
<head><title>Sign Up</title></head>
<body style="font-family: Arial; margin: 40px;">
    <h2>Create Account</h2>
    {% if msg %}<p style="color: red;">{{ msg }}</p>{% endif %}
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="fname" placeholder="First Name" required><br><br>
        <input type="text" name="lname" placeholder="Last Name" required><br><br>
        <input type="email" name="email" placeholder="Email" required><br><br>
        <input type="text" name="mobile" placeholder="Mobile Number" required><br><br>
        <textarea name="address" placeholder="Complete Address" required></textarea><br><br>
        <input type="password" name="password" placeholder="Password" required><br><br>
        <button type="submit">Sign Up</button>
    </form>
    <p>Already registered? <a href="{% url 'login' %}">Login here</a></p>
</body>
</html>
