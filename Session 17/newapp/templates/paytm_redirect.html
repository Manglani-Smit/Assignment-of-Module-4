<!DOCTYPE html>
<html>
<head><title>Redirecting to Paytm Sandbox...</title></head>
<body style="font-family: Arial; margin: 40px;">
    <h3>Redirecting to Paytm Payment Gateway...</h3>
    <form id="paytm_form" method="POST" action="{% url 'payment_callback' %}">
        {% csrf_token %}
        <input type="hidden" name="ORDERID" value="{{ paytm_params.ORDER_ID }}">
        <input type="hidden" name="TXNAMOUNT" value="{{ paytm_params.TXN_AMOUNT }}">
        <input type="hidden" name="RESPCODE" value="01">
        <p>Order ID: {{ paytm_params.ORDER_ID }}</p>
        <p>Amount: ₹{{ paytm_params.TXN_AMOUNT }}</p>
        <button type="submit" style="padding: 10px 20px; background: #002970; color: #fff; border: none;">
            Confirm Mock Payment (Sandbox)
        </button>
    </form>
</body>
</html>
