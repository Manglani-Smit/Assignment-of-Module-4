{% extends 'base.html' %}
{% load static %}

{% block title %}Sign Up - MusicZone{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm border-0 rounded-3 p-4">
            <h3 class="fw-bold text-center mb-3">Create an Account</h3>

            {% if msg %}
                <div class="alert alert-info py-2 text-center" role="alert">
                    {{ msg }}
                </div>
            {% endif %}

            <form action="{% url 'signup' %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">First Name</label>
                        <input type="text" class="form-control" name="fname" placeholder="First name" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Last Name</label>
                        <input type="text" class="form-control" name="lname" placeholder="Last name" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" class="form-control" name="email" placeholder="name@example.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Mobile Number</label>
                    <input type="tel" class="form-control" name="mobile" maxlength="10" placeholder="10-digit number" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Profile Picture</label>
                    <input type="file" class="form-control" name="profile_picture" accept="image/*" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Address</label>
                    <textarea class="form-control" name="address" rows="2" placeholder="Your address"></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Password" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Confirm Password</label>
                        <input type="password" class="form-control" name="cpassword" placeholder="Confirm password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mt-2 fw-semibold">Sign Up</button>
            </form>

            <div class="text-center mt-3">
                <small class="text-muted">Already have an account? <a href="{% url 'login' %}" class="text-decoration-none">Login here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
