<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Product - Flipkart Seller Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f1f3f6; color: #212121; }
        .navbar { background-color: #2874f0; color: #ffffff; padding: 14px 40px; }
        .navbar h2 { font-size: 20px; font-style: italic; font-weight: bold; }
        .box { max-width: 480px; margin: 60px auto; background: #ffffff; border-radius: 4px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
        h3 { font-size: 20px; margin-bottom: 12px; color: #d32f2f; }
        p { font-size: 14px; color: #555; margin-bottom: 24px; line-height: 1.5; }
        .btn-group { display: flex; gap: 12px; justify-content: center; }
        .btn-del { flex: 1; background-color: #d32f2f; color: white; border: none; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 2px; cursor: pointer; }
        .btn-cancel { flex: 1; text-align: center; border: 1px solid #dcdcdc; color: #212121; padding: 11px; text-decoration: none; border-radius: 2px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>Flipkart Seller Hub</h2>
    </div>

    <div class="box">
        <h3>Delete Product?</h3>
        <p>Are you sure you want to delete <strong>"{{ product.name }}"</strong>? This cannot be undone.</p>

        <form method="POST">
            {% csrf_token %}
            <div class="btn-group">
                <button type="submit" class="btn-del">Yes, delete</button>
                <a href="{% url 'product_list' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
