<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post Product - Seller Panel</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .form-box { width: 350px; padding: 20px; border: 1px solid #ccc; border-radius: 6px; }
        input, textarea, button { width: 100%; margin-bottom: 12px; padding: 8px; box-sizing: border-box; }
        button { background-color: #fb641b; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Post New Product</h2>
        {% if msg %}
            <p style="color: green; font-weight: bold;">{{ msg }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label>Product Name:</label>
            <input type="text" name="product_name" required>

            <label>Price (₹):</label>
            <input type="number" step="0.01" name="price" required>

            <label>Description:</label>
            <textarea name="description" rows="4" required></textarea>

            <button type="submit">Add Product</button>
        </form>
    </div>
</body>
</html>
