<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seller Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #2874f0; color: white; }
    </style>
</head>
<body>
    <h1>Seller Dashboard</h1>
    <p>Welcome, <strong>{{ user.fname }}</strong>! Manage your products here.</p>
    <a href="{% url 'post_product' %}">+ Add New Product</a>

    <table>
        <tr>
            <th>Product ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Description</th>
        </tr>
        {% for prod in products %}
        <tr>
            <td>{{ prod.id }}</td>
            <td>{{ prod.product_name }}</td>
            <td>₹{{ prod.price }}</td>
            <td>{{ prod.description }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">You Don't Listed any Product.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
