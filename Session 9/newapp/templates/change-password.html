{% extends 'base.html' %}

{% block title %}Change Password - RestaurantApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-3 p-4">
            <h3 class="fw-bold text-center mb-3">Change Password</h3>

            {% if msg %}
                <div class="alert alert-danger py-2 text-center" role="alert">
                    {{ msg }}
                </div>
            {% endif %}

            <form action="{% url 'change_password' %}" method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">Old Password</label>
                    <input type="password" name="old_password" class="form-control" placeholder="Enter current password" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">New Password</label>
                    <input type="password" name="new_password" class="form-control" placeholder="Enter new password" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Confirm New Password</label>
                    <input type="password" name="cnew_password" class="form-control" placeholder="Re-enter new password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
