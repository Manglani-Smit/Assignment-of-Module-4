<!DOCTYPE html>
<html>
<head><title>Verify OTP</title></head>
<body style="font-family: Arial; margin: 30px;">
    <h2>Enter 6-Digit OTP</h2>
    <p>Verifying OTP for: <strong>{{ email }}</strong></p>
    {% for message in messages %}
        <div style="background: #eef; padding: 10px; border-left: 4px solid #00f; margin-bottom: 15px;">
            {{ message }}
        </div>
    {% endfor %}
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="otp" maxlength="6" placeholder="Enter 6-digit OTP" required style="padding: 8px; font-size: 16px;">
        <button type="submit" style="padding: 8px 16px;">Verify & Access Dashboard</button>
    </form>
</body>
</html>
