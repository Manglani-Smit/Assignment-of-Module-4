<!DOCTYPE html>
<html>
<head>
    <title>Google Login Demo</title>
</head>
<body>
    <h2>Google OAuth Integration</h2>

    {% if user.is_authenticated %}
        <p><strong>Name:</strong> {{ user.get_full_name|default:user.username }}</p>
        <p><strong>Email:</strong> {{ user.email }}</p>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    {% else %}
<form method="post" action="{% url 'social:begin' 'google-oauth2' %}">
    {% csrf_token %}
    <button type="submit" style="background: #4285F4; color: white; padding: 10px 18px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
        Sign in with Google
    </button>
</form>    {% endif %}
</body>
</html>
