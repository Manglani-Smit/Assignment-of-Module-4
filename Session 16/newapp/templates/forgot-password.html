<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .box { width: 320px; padding: 20px; border: 1px solid #ddd; border-radius: 6px; }
        input, button { width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Forgot Password</h2>
        {% if msg %}
            <p style="color: red; font-size: 14px;">{{ msg }}</p>
        {% endif %}
        <form method="POST" action="{% url 'forgot_password' %}">
            {% csrf_token %}
            <label>Registered Mobile Number:</label>
            <input type="text" name="mobile" maxlength="10" placeholder="Enter 10-digit mobile" required>
            <button type="submit">Send OTP</button>
        </form>
    </div>
</body>
</html>
