<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .box { width: 320px; padding: 20px; border: 1px solid #ddd; border-radius: 6px; }
        input, button { width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; }
        button { background-color: #17a2b8; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Reset Password</h2>
        {% if msg %}
            <p style="color: {% if success %}green{% else %}red{% endif %}; font-size: 14px;">{{ msg }}</p>
        {% endif %}

        {% if not success %}
        <form method="POST" action="{% url 'new_password' %}">
            {% csrf_token %}
            <label>New Password:</label>
            <input type="password" name="new_password" required>

            <label>Confirm Password:</label>
            <input type="password" name="cnew_password" required>

            <button type="submit">Update Password</button>
        </form>
        {% else %}
            <a href="{% url 'home' %}">Go to Home / Login</a>
        {% endif %}
    </div>
</body>
</html>
