{% extends 'base.html' %}

{% block title %}Forgot Password - RestaurantApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-3 p-4">
            <h3 class="fw-bold text-center mb-3">Forgot Password</h3>
            <p class="text-center text-muted small mb-3">Enter your registered email to receive an OTP.</p>

            {% if msg %}
                <div class="alert alert-danger py-2 text-center" role="alert">
                    {{ msg }}
                </div>
            {% endif %}

            <form action="{% url 'forgot_password' %}" method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">Registered Email</label>
                    <input type="email" name="email" class="form-control" placeholder="Enter email address" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Send OTP</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
