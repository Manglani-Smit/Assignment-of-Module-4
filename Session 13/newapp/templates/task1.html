<!DOCTYPE html>
<html>
<head>
    <title>Spotify Playlist</title>
</head>
<body>
    <h2>My Playlist</h2>
    <ul>
        <li id="song-1">
            Tum Hi Ho <button onclick="deleteSong(1)">Delete</button>
        </li>
        <li id="song-2">
            Kesariya <button onclick="deleteSong(2)">Delete</button>
        </li>
        <li id="song-3">
            Apna Bana Le <button onclick="deleteSong(3)">Delete</button>
        </li>
    </ul>

    <script>
        function deleteSong(id) {
            fetch('https://jsonplaceholder.typicode.com/posts/' + id, {
                method: 'DELETE'
            })
            .then(res => {
                document.getElementById('song-' + id).remove();
            });
        }
    </script>
</body>
</html>
